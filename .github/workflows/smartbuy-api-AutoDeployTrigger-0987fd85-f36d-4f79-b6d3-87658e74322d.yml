name: Trigger auto deployment for smartbuy-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/smartbuy-api-AutoDeployTrigger-0987fd85-f36d-4f79-b6d3-87658e74322d.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SMARTBUYAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SMARTBUYAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SMARTBUYAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: smartbuyacr2847.azurecr.io
          registryUsername: ${{ secrets.SMARTBUYAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SMARTBUYAPI_REGISTRY_PASSWORD }}
          containerAppName: smartbuy-api
          resourceGroup: smartbuy-rg
          imageToBuild: smartbuyacr2847.azurecr.io/smartbuy-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


