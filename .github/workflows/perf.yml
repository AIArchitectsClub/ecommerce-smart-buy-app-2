name: Performance

# Manual only — NOT run on every PR/push. Latency-threshold results are more
# prone to noise on shared GitHub-hosted runners than on a real dev machine,
# so this shouldn't gate merges. Trigger it from the Actions tab when you
# want a read on NFR compliance (e.g. before a release).
on:
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - uses: grafana/setup-k6-action@v1

      - name: Create .env.perf
        run: echo "PERF_DATABASE_URL=${{ secrets.PERF_DATABASE_URL }}" > .env.perf

      - run: npm run perf:db:setup

      # continue-on-error: a threshold breach is useful signal, not a build
      # failure — this workflow's whole point is "don't fail CI on perf."
      # The report is uploaded either way so you can see what happened.
      - name: Run perf smoke test
        continue-on-error: true
        run: npm run perf:smoke

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf/results/
          retention-days: 7
